spring.application.name=recipehub
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/recipehub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.jwt.secret=${JWT_SECRET:DEVELOPMENT_ONLY_REPLACE_WITH_32_RANDOM_BYTES_BEFORE_DEPLOY}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
management.endpoints.web.exposure.include=health,info
